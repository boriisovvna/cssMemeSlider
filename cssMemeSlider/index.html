<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="slider">
        <input type="radio" name="slide-button" id="slide-1" checked>
        <input type="radio" name="slide-button" id="slide-2">
        <input type="radio" name="slide-button" id="slide-3">
        <input type="radio" name="slide-button" id="slide-4">
        <input type="radio" name="slide-button" id="slide-5">
    
        <div class="slider-images">
            <div class="image">
                <img src="img/image-1.jpg" alt="image-1">
            </div>
            <div class="image">
                <img src="img/image-2.gif" alt="image-2">
            </div>
            <div class="image">
                <img src="img/image-3.gif" alt="image-3">
            </div>
            <div class="image">
                <img src="img/image-4.gif" alt="image-4">
            </div>
            <div class="image">
                <img src="img/image-5.gif" alt="image-5">
            </div>
        </div>

        <div class="slider-labels">
            <label for="slide-1" class="slider-lab">HELLO!</label>
            <label for="slide-2" class="slider-lab">How are you doing?</label>
            <label for="slide-3" class="slider-lab">I hope everything is fine!</label>
            <label for="slide-4" class="slider-lab">Wish you all the best!</label>
            <label for="slide-5" class="slider-lab">BYYYYE!</label>
        </div>

    </div>
</body>
</html>
